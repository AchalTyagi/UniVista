<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniVista</title>
    <link rel="stylesheet" href="mainpage_styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <h1>UniVista</h1>
            </div>

            <div class="nav-links">
                <a href="#">About Us</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="main-section">
            <div class="main-content">
                <h2>Will You Survive This Sem?</h2>
                <h3>Let's do the math.</h3>
                <p>Turn your sleep deprivation, low bank balance, and skipped classes into an actual survival plan.</p>
                <button class="button">Calculate My Survival &rarr;</button>
                <div class="social-data">
                    <span>14,292 students calculating their survival criteria across 400+ campuses.</span>
                </div>
            </div>

            <div class="form-container">
                <div class="form-tabs">
                    <button class="active">Sign In</button>
                    <button>Create Account</button>
                </div>
                <form class="login-form">
                    <div class="web-login">
                        <button type="button">Continue with Google</button>
                        <button type="button">Continue with Discord</button>
                    </div>
                    
                    <label for="email">Personal ID</label>
                    <input type="email" id="email" placeholder="xyz@domain.name.com" required>
                    
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter Password" required>
                    
                    <div class="form-actions">
                        <label>
                            <input type="checkbox" name="remember"> Remember Me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="submit-button">Log Me In</button>
                </form>
            </div>
        </section>
        </main>
    </body>
</html>
